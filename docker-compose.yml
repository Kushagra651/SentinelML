version: "3.9"

# ── Shared network ────────────────────────────────────────────────────────────
networks:
  ml_net:
    driver: bridge

# ── Named volumes (persist across docker compose down — NEVER use -v) ─────────
volumes:
  postgres_data:
  airflow_postgres_data:
  grafana_data:
  prometheus_data:
  artifacts_data:

# ── Common Airflow env (shared by webserver + scheduler) ──────────────────────
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: dockerfiles/Dockerfile.airflow
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@ml_postgres:5432/${POSTGRES_AIRFLOW_DB}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    # Project env vars forwarded into DAG tasks
    ARTIFACTS_DIR: /app/artifacts
    MODEL_DIR: /app/artifacts/models
    POSTGRES_HOST: ml_postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    TARGET_COLUMN: income
    SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    PAGERDUTY_ROUTING_KEY: ${PAGERDUTY_ROUTING_KEY:-}
    TRAINING_SCHEDULE: ${TRAINING_SCHEDULE:-0 2 * * 0}
    DRIFT_CHECK_SCHEDULE: ${DRIFT_CHECK_SCHEDULE:-0 */6 * * *}
    RETRAIN_TRIGGER_SCHEDULE: ${RETRAIN_TRIGGER_SCHEDULE:-30 */6 * * *}
    RETRAIN_COOLDOWN_HOURS: ${RETRAIN_COOLDOWN_HOURS:-12}
  volumes:
    - artifacts_data:/app/artifacts
  networks:
    - ml_net
  depends_on:
    ml_postgres:
      condition: service_healthy

services:

  # ── API + Prometheus exporter ───────────────────────────────────────────────
  ml_api:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.api
    container_name: ml_api
    restart: unless-stopped
    ports:
      - "8000:8000"   # FastAPI
      - "9100:9100"   # Prometheus exporter
    environment:
      ARTIFACTS_DIR: /app/artifacts
      MODEL_DIR: /app/artifacts/models
      EXPORTER_PORT: "9100"
      TARGET_COLUMN: income
      POSTGRES_HOST: ml_postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      GROQ_API_KEY: ${GROQ_API_KEY}
      AGENT_API_BASE: http://ml_api:8000
    volumes:
      - artifacts_data:/app/artifacts
    networks:
      - ml_net
    depends_on:
      ml_postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  ml_postgres:
    image: postgres:16-alpine
    container_name: ml_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    networks:
      - ml_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Prometheus ─────────────────────────────────────────────────────────────
  ml_prometheus:
    image: prom/prometheus:v2.51.0
    container_name: ml_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    networks:
      - ml_net

  # ── Grafana ────────────────────────────────────────────────────────────────
  ml_grafana:
    image: grafana/grafana:10.4.2
    container_name: ml_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/dashboards.json
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./grafana/dashboards.json:/var/lib/grafana/dashboards/dashboards.json:ro
      # NOTE: do NOT mount grafana_alerts.json — it causes Grafana to crash on startup
    networks:
      - ml_net
    depends_on:
      - ml_prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Airflow init (runs once, then exits) ────────────────────────────────────
  airflow_init:
    <<: *airflow-common
    container_name: airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init
        airflow users create \
          --username ${AIRFLOW_USER:-admin} \
          --password ${AIRFLOW_PASSWORD:-admin} \
          --firstname ML \
          --lastname Admin \
          --role Admin \
          --email admin@sentinelml.local
    restart: "no"

  # ── Airflow webserver ───────────────────────────────────────────────────────
  airflow_webserver:
    <<: *airflow-common
    container_name: airflow_webserver
    restart: unless-stopped
    ports:
      - "8080:8080"
    command: airflow webserver
    depends_on:
      airflow_init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Airflow scheduler ───────────────────────────────────────────────────────
  airflow_scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler
    restart: unless-stopped
    command: airflow scheduler
    depends_on:
      airflow_init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $(hostname)"]
      interval: 60s
      timeout: 10s
      retries: 3

  # ── Node exporter (host metrics) ────────────────────────────────────────────
  ml_node_exporter:
    image: prom/node-exporter:v1.7.0
    container_name: ml_node_exporter
    restart: unless-stopped
    ports:
      - "9101:9100"   # 9101 on host, 9100 inside container
    networks:
      - ml_net
    command:
      - "--path.rootfs=/host"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro

  # ── cAdvisor (container metrics) ───────────────────────────────────────────
  ml_cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: ml_cadvisor
    restart: unless-stopped
    ports:
      - "8081:8080"
    networks:
      - ml_net
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro