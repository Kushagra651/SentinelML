global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: ml_api
    static_configs:
      - targets: ["ml_api:8000"]

  - job_name: ml_exporter
    static_configs:
      - targets: ["ml_api:9100"]

  - job_name: node_exporter
    static_configs:
      - targets: ["ml_node_exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["ml_cadvisor:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]